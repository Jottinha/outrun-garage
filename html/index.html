<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Outrun Garage</title>
</head>
<body>
    <div id="app" style="display: none;">

        <!-- Menu Principal -->
        <div id="garage-menu" class="panel">
            <div class="panel-header">
                <h1>OUTRUN <span class="accent">GARAGE</span></h1>
                <button class="btn-close" id="btn-close">&times;</button>
            </div>
            <div class="panel-body">
                <div id="vehicle-list"></div>
                <div id="no-vehicles" style="display: none;">
                    <p>Nenhum veículo na garagem.</p>
                </div>
            </div>
            <div class="panel-footer">
                <button id="btn-get-vehicle" class="btn btn-primary">+ PEGAR VEÍCULO</button>
                <span id="vehicle-count" class="count"></span>
            </div>
        </div>

        <!-- Seleção de Veículo -->
        <div id="vehicle-picker" class="panel" style="display: none;">
            <div class="panel-header">
                <button class="btn-back" id="btn-back">&larr;</button>
                <h1>SELECIONAR <span class="accent">VEÍCULO</span></h1>
            </div>
            <div class="panel-body">
                <div id="picker-list" class="picker-grid"></div>
            </div>
        </div>

        <!-- Customização -->
        <div id="customize-menu" class="customize-panel" style="display: none;">
            <div class="customize-header">
                <h2>CUSTOMIZAR</h2>
            </div>
            <div class="stats-panel" id="stats-panel">
                <div class="stat-row">
                    <span class="stat-label">Velocidade</span>
                    <div class="stat-bar"><div class="stat-fill" id="stat-speed"></div></div>
                    <span class="stat-val" id="stat-speed-val">0%</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Aceleração</span>
                    <div class="stat-bar"><div class="stat-fill" id="stat-accel"></div></div>
                    <span class="stat-val" id="stat-accel-val">0%</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Frenagem</span>
                    <div class="stat-bar"><div class="stat-fill" id="stat-braking"></div></div>
                    <span class="stat-val" id="stat-braking-val">0%</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Tração</span>
                    <div class="stat-bar"><div class="stat-fill" id="stat-traction"></div></div>
                    <span class="stat-val" id="stat-traction-val">0%</span>
                </div>
            </div>
            <div class="section-tabs" id="section-tabs"></div>
            <div class="section-content" id="section-content"></div>
            <div class="customize-footer">
                <button class="btn btn-success" id="btn-save">SALVAR</button>
                <button class="btn btn-danger" id="btn-cancel">CANCELAR</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
